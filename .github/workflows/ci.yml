name: ci

on:
  pull_request:
  push:
    branches: [main]

# Sin `paths-ignore`: los checks son requeridos por ruleset, y un check que no
# corre nunca reporta, lo que dejaría el PR bloqueado para siempre esperándolo.
concurrency:
  group: ci-${{ github.ref }}
  # Solo en PRs: en main cada run respalda un commit ya mergeado.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Los checks baratos juntos: fallan en menos de un minuto, sin esperar el build.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Los jobs corren código del repo (lifecycle scripts de pnpm, next
          # build); no hace falta dejarles el token en .git/config.
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test --coverage
      - name: Reportar coverage
        if: always()
        run: |
          [ -f coverage/coverage-summary.json ] || exit 0
          node -e '
            const t = require("./coverage/coverage-summary.json").total;
            console.log("## Coverage\n");
            console.log("| Métrica | % | Cubierto |");
            console.log("|---|---|---|");
            for (const k of ["lines", "statements", "functions", "branches"]) {
              console.log(`| ${k} | ${t[k].pct}% | ${t[k].covered}/${t[k].total} |`);
            }
          ' >> "$GITHUB_STEP_SUMMARY"

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Los jobs corren código del repo (lifecycle scripts de pnpm, next
          # build); no hace falta dejarles el token en .git/config.
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  # Levanta la Supabase local igual que en una máquina de desarrollo y
  # comprueba que el entorno que describe el README es el que sale. Cubre las
  # dos cosas que se rompen en silencio: una migración que ya no aplica sobre
  # una base limpia, y un seed que inserta datos que Auth después no puede leer.
  supabase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Versión fija: sin esto el job depende de lo que publique Supabase ese
      # día y una regresión de la CLI llegaría como un fallo en un PR ajeno.
      - uses: supabase/setup-cli@v3
        with:
          version: 2.109.1
      # Aplica migrations/ y seed.sql sobre una base recién creada.
      - run: supabase start
      # Node acá también: el chequeo de los handlers necesita la app levantada.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # RLS y los triggers son la frontera de seguridad de las reseñas: la Data
      # API sigue alcanzable con la publishable key, así que un error en una
      # política es una fuga que ningún test de TypeScript detecta.
      - name: Tests de base (pgTAP)
        run: supabase test db
      - name: Verificar migraciones y seed
        run: |
          set -euo pipefail
          eval "$(supabase status -o env | sed 's/^/export /')"
          AUTH="$API_URL/auth/v1"
          # Los signups de abajo son desechables: lo que se comprueba es el
          # dominio, no la credencial. Una contraseña al azar evita dejar un
          # par correo/contraseña escrito en el repo.
          PASS=$(openssl rand -base64 18)

          # La del seed sale del propio seed, por lo mismo y porque así este
          # check sigue al archivo si alguien cambia la contraseña allá.
          SEED_PASS=$(sed -n "s/.*extensions\.crypt('\([^']*\)'.*/\1/p" supabase/seed.sql | head -1)
          [ -n "$SEED_PASS" ] || { echo "No pude leer la contraseña de supabase/seed.sql"; exit 1; }

          echo "El estudiante sembrado inicia sesión"
          # Login de verdad y no una lectura por la API admin: así el check
          # cubre las dos formas de sembrar mal, un hash de contraseña
          # inservible y las columnas de token en NULL, que a GoTrue le
          # provocan un 500 al leer la fila.
          # `// empty` cubre tanto el token nulo como la respuesta de error, que
          # no trae la clave. Buscar el nombre del campo no alcanza: un
          # access_token vacío también lo contiene.
          token=$(curl -sS -X POST "$AUTH/token?grant_type=password" \
            -H "apikey: $ANON_KEY" -H "Content-Type: application/json" \
            -d "{\"email\":\"estudiante@utec.edu.pe\",\"password\":\"$SEED_PASS\"}" \
            | jq -r '.access_token // empty')
          [ -n "$token" ] || { echo "El login no devolvió un access_token"; exit 1; }

          echo "El hook de dominio rechaza una cuenta que no es de UTEC"
          codigo=$(curl -sS -o /dev/null -w '%{http_code}' -X POST "$AUTH/signup" \
            -H "apikey: $ANON_KEY" -H "Content-Type: application/json" \
            -d "{\"email\":\"alguien@gmail.com\",\"password\":\"$PASS\"}")
          [ "$codigo" = "403" ] || { echo "Se esperaba 403, llegó $codigo"; exit 1; }

          echo "El hook de dominio acepta una cuenta de UTEC"
          codigo=$(curl -sS -o /dev/null -w '%{http_code}' -X POST "$AUTH/signup" \
            -H "apikey: $ANON_KEY" -H "Content-Type: application/json" \
            -d "{\"email\":\"nueva@utec.edu.pe\",\"password\":\"$PASS\"}")
          [ "$codigo" = "200" ] || { echo "Se esperaba 200, llegó $codigo"; exit 1; }

      # La costura que nadie más cubre: vitest simula el `fetch` y el pgTAP se
      # queda dentro de Postgres, así que nadie comprueba que el handler
      # traduzca las reglas de la base a estados HTTP. Publicar dos veces el
      # mismo par tiene que terminar en 409 con la reseña que ya existía, y no
      # en un 500.
      #
      # Con `pnpm dev` y no con `pnpm build && pnpm start`: lo que se prueba es
      # la lógica de los handlers, que es la misma, y el job `build` ya cubre
      # que la app compile. Arrancar sin construir ahorra más de un minuto.
      - name: Verificar los handlers de reseñas
        run: |
          set -euo pipefail
          eval "$(supabase status -o env | sed 's/^/export /')"

          NEXT_PUBLIC_SUPABASE_URL="$API_URL" \
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY="$PUBLISHABLE_KEY" \
            pnpm dev >/tmp/next-dev.log 2>&1 &

          # Turbopack compila cada ruta al primer pedido, así que la espera es
          # por una respuesta y no por el puerto abierto.
          for _ in $(seq 1 60); do
            curl -sf -o /dev/null http://localhost:3000/api/careers && break
            sleep 1
          done

          ./scripts/verificar-api-de-resenas.sh || {
            echo "--- salida del servidor ---"; cat /tmp/next-dev.log; exit 1;
          }
